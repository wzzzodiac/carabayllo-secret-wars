<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090e18"><meta name="description" content="Carabayllo Secret Wars — private rooms and desktop artillery battles.">
<title>Carabayllo Secret Wars</title>
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=phase7a-battle-frame-1">
<link rel="stylesheet" href="lobby.css?v=multiplayer-feel-20261026">
<link rel="stylesheet" href="appearance.css?v=peru-canon3-20261024">
<script type="importmap">{"imports":{"./renderer.js?v=phase6c-heal-1":"./renderer10-huancavelica.js?v=huancavelica-v2-bitmap-1&look=pickup-spin-20261025","./renderer6f.js?v=v09-beta-countdown-1":"./renderer6f.js?v=v098-csw-afk-spectator-1","./combat-controls.js?v=phase6b-afk-1":"./combat-controls6f.js?v=lobby-first-20261024","./match-stats7a1.js?v=phase7a1-stats-1":"./match-stats7a1.js?v=v098-rc-stats-1"}}</script>
</head>
<body class="lobby-page" data-phase="entry">
<main class="shell">
<header class="hero" id="menu">
  <div><p class="eyebrow">PRIVATE ROOMS · UP TO 8 PLAYERS</p><h1>CARABAYLLO <span>SECRET WARS</span></h1></div>
  <span class="connection" id="serverStatus" role="status" data-state="idle">On demand</span>
</header>
<section class="lobby-grid" aria-label="Room menu">
  <div class="lobby-card" id="entryPanel">
    <p class="section-label">PLAY</p>
    <label for="playerName">NAME</label><input id="playerName" maxlength="20" autocomplete="nickname" placeholder="Your name">
    <div id="appearancePicker" aria-label="Your character"></div>
    <div class="entry-actions">
      <button id="createRoom" class="primary-action" type="button">CREATE ROOM <span aria-hidden="true">↗</span></button>
      <div class="join-row"><input id="roomCode" maxlength="4" autocomplete="off" placeholder="CODE" aria-label="Room code"><button id="joinRoom" type="button">JOIN ROOM</button></div>
    </div>
    <a class="try-link" href="./practice.html?v=english-release-20261025"><span>TRY IT <small>Solo practice</small></span><span aria-hidden="true">→</span></a>
  </div>
  <div class="lobby-card room-card">
    <div class="room-heading">
      <div><p class="section-label">LOBBY</p><strong id="activeRoomCode">----</strong></div>
      <div class="room-meta"><span id="roomStatus">NO ROOM</span><span id="roomCount">0 / 8</span></div>
    </div>
    <div id="playerList" class="player-list"><div class="empty-room">Create or join a room.</div></div>
    <nav id="partyActions" class="party-actions" aria-label="Party" hidden><button id="returnToLobby" type="button" hidden>Return to lobby</button><button id="leaveParty" type="button">Leave party</button></nav>
    <div id="roomControls" class="room-controls" hidden>
      <div id="modeControls" class="control-group"><span class="control-label">MODE</span><div class="button-row"><button id="teamModeButton" type="button">TEAMS</button><button id="survivalModeButton" type="button">SURVIVAL</button></div></div>
      <div id="teamControls" class="control-group"><span class="control-label">TEAM</span><div class="button-row"><button id="teamAButton" type="button">TEAM A</button><button id="teamBButton" type="button">TEAM B</button></div></div>
      <button id="readyButton" class="ready-button" type="button">READY</button>
      <button id="startGameButton" class="start-button" type="button" hidden>START</button>
      <p id="lobbyHint" class="lobby-hint">Choose a team. Ready up.</p>
    </div>
  </div>
</section>
<p id="actionMessage" class="message" role="status"></p>
<nav id="matchNotice" class="match-notice" aria-label="Match navigation" hidden><span id="matchNoticeText" role="status">Match ready</span><a href="#battle" id="playMatch">PLAY ↓</a></nav>
<section class="battle-layout" id="battle" aria-label="Match" tabindex="-1" hidden>
  <div class="game-frame" aria-label="Synchronized turn-based artillery world">
    <canvas id="gameCanvas" width="1600" height="900" tabindex="0" aria-label="Game arena"></canvas>
    <div class="overlay" hidden><p id="arenaTitle"></p><span id="arenaSubtitle"></span></div>
  </div>
  <aside id="gameInfoPanel" class="game-info-panel" aria-label="Match controls"><div class="game-info-empty"><strong>Starting…</strong></div></aside>
</section>
<footer><span>PC · KEYBOARD + MOUSE</span><span>CARABAYLLO SECRET WARS // HUANCAVELICA V2</span></footer>
</main>
<script type="module" src="music.js?v=v098-csw-master-volume-3"></script>
<script type="module" src="audio.js?v=v098-csw-nuke-sync-1"></script>
<script type="module" src="client.js?v=multiplayer-feel-20261026"></script>
</body>
</html>
