name: Frontend CI

on:
  push:
    branches: [main, phase10-development]
  pull_request:
    branches: [main, phase10-development]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node --check client.js
      - run: node --check config.js
      - run: node --check renderer.js
      - run: node --check renderer6d.js
      - run: node --check renderer6f.js
      - run: node --check renderer7a-visual.js
      - run: node --check renderer10-huancavelica.js
      - run: node --check huancavelica-map.js
      - run: node --check huancavelica-v2-map.js
      - run: node --check combat-controls.js
      - run: node --check combat-controls6d.js
      - run: node --check combat-controls6f.js
      - run: node --check match-stats7a1.js
      - run: node --check ui.js
      - run: node --check socket.js
      - run: node --check music.js
      - run: node --check audio.js
      - run: node --check wind-gusts.js
      - run: node --check projectile-renderer.js
      - run: node --check terrain-renderer.js
      - run: node test/shared-core.mjs --practice
